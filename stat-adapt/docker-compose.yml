services:
  backend:
    build: ./backend
    environment:
      - FRONTEND_URL=http://localhost:5173
      - JWT_SECRET=demo-secret-change-me
      - DATABASE_URL=sqlite:///./statadapt.db
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
